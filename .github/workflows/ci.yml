name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/sinfleet_ci
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify auth foundation
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/sinfleet_ci
          JWT_ACCESS_SECRET: ci-only-sinfleet-access-secret-not-production
          JWT_REFRESH_SECRET: ci-only-sinfleet-refresh-secret-not-production
          BCRYPT_SALT_ROUNDS: '10'
        run: npm run verify:auth
